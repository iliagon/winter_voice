name: Release

# Builds MacVoice.dmg and attaches it to the GitHub Release whenever a
# v* tag is pushed (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# The asset name is stable so this URL always serves the newest build:
# https://github.com/winterzxzz/winter_voice/releases/latest/download/MacVoice.dmg

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build and publish .dmg
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build MacVoice.dmg
        run: bash scripts/build-dmg.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/MacVoice.dmg
          generate_release_notes: true
